name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev,format

      - name: Run linting
        run: |
          poetry run ruff check .
          poetry run mypy .
          poetry run pylint .

      - name: Run tests
        run: poetry run pytest tests/ -v --tb=short
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          CHAT_KEY: ${{ secrets.CHAT_KEY }}
          COMPLETION_KEY: ${{ secrets.COMPLETION_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          WORKFLOW_KEY: ${{ secrets.WORKFLOW_KEY }}

      - name: Bump version
        run: poetry version ${{ inputs.version_type }}

      - name: Get version
        id: version
        run: echo "version=$(poetry version -s)" >> $GITHUB_OUTPUT

      - name: Check tag does not already exist
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Delete it first or choose a different version type."
            exit 1
          fi

      - name: Commit and push
        id: bump_commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip actions]"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Build package
        run: poetry build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.bump_commit.outputs.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to PyPI
        run: poetry publish
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
